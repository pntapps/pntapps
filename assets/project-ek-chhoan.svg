<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif">
<style>.rip{transform-origin:370px 135px;animation:rip 2.2s ease-out infinite}.rip2{animation-delay:1.1s}@keyframes rip{from{transform:scale(.3);opacity:.9}to{transform:scale(2.4);opacity:0}}.heart{transform-origin:480px 70px;animation:beat 1.6s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a10"/><stop offset="1" stop-color="#0c2e1c"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#22c55e" stop-opacity=".45"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" opacity=".08"/></pattern>
  <clipPath id="cc"><rect width="600" height="220" rx="18"/></clipPath>
  
</defs>
<g clip-path="url(#cc)">
  <rect width="600" height="220" fill="url(#bg)"/><rect width="600" height="220" fill="url(#dots)"/>
  <circle cx="470" cy="110" r="190" fill="url(#glow)"><animate attributeName="r" values="170;205;170" dur="7s" repeatCount="indefinite"/></circle>
  <g transform="translate(320 18)">
    <rect width="132" height="190" rx="20" fill="#0d2418" stroke="#22c55e" stroke-opacity=".5" stroke-width="2"/>
    <rect x="8" y="10" width="116" height="170" rx="14" fill="#f8fafc"/>
    <text x="66" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">4:14</text>
    <text x="66" y="54" text-anchor="middle" font-size="8" fill="#556070">Good afternoon</text>
    <rect x="12" y="62" width="44" height="36" rx="9" fill="#22c55e"/><rect x="64" y="62" width="44" height="36" rx="9" fill="#3b82f6"/><rect x="12" y="106" width="44" height="36" rx="9" fill="#f59e0b"/><rect x="64" y="106" width="44" height="36" rx="9" fill="#ec4899"/>
  </g>
  <circle class="rip" cx="370" cy="135" r="14" fill="none" stroke="#22c55e" stroke-width="3"/>
  <circle class="rip rip2" cx="370" cy="135" r="14" fill="none" stroke="#22c55e" stroke-width="3"/>
  <g class="heart"><path d="M480 82 l-14 -14 a8 8 0 0 1 14 -10 a8 8 0 0 1 14 10 z" fill="#f43f5e"/></g>
  <g font-size="15" font-weight="700" fill="#86efac"><text x="482" y="130">এক ছোঁয়া</text><text x="482" y="152">एक छुअन</text></g>
  <g fill="#22c55e"><rect x="32" y="40" width="110" height="10" rx="5"/><rect x="32" y="60" width="170" height="8" rx="4" opacity=".4"/><rect x="32" y="76" width="140" height="8" rx="4" opacity=".4"/></g>
  <g font-family="Consolas,monospace" font-size="12" fill="#86efac"><text x="32" y="114">no internet · 100% private</text></g>
  <rect x=".5" y=".5" width="599" height="219" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</g>
<text x="32" y="186" font-size="34" font-weight="700" fill="#fff" letter-spacing="-.5">Ek Chhoan</text>
<text x="33" y="206" font-size="13" fill="#ffffff" fill-opacity=".65">A calm, elder-friendly Android home screen</text>
</svg>