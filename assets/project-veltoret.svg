<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" font-family="'Segoe UI',Inter,-apple-system,Helvetica,Arial,sans-serif">
<style>.reel{animation:slide 14s linear infinite}@keyframes slide{to{transform:translateX(-430px)}}.play{transform-origin:438px 92px;animation:beat 2s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.spot{animation:sweep 5s ease-in-out infinite;transform-origin:438px -40px}@keyframes sweep{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1206"/><stop offset="1" stop-color="#2a1a05"/></linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#f59e0b" stop-opacity=".45"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" opacity=".08"/></pattern>
  <clipPath id="cc"><rect width="600" height="220" rx="18"/></clipPath>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde68a" stop-opacity=".35"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></linearGradient><clipPath id="win"><rect x="300" y="26" width="276" height="132" rx="10"/></clipPath>
</defs>
<g clip-path="url(#cc)">
  <rect width="600" height="220" fill="url(#bg)"/><rect width="600" height="220" fill="url(#dots)"/>
  <circle cx="470" cy="60" r="190" fill="url(#glow)"><animate attributeName="r" values="170;205;170" dur="7s" repeatCount="indefinite"/></circle>
  <path class="spot" d="M438 -40 L380 170 L496 170 Z" fill="url(#beam)"/>
  <rect x="300" y="26" width="276" height="132" rx="10" fill="#0b0703" stroke="#f59e0b" stroke-opacity=".4" stroke-width="2"/>
  <g clip-path="url(#win)"><g transform="translate(312 40)" opacity=".85"><g class="reel"><rect x="0" y="0" width="74" height="104" rx="8" fill="#f59e0b"/><rect x="8" y="80" width="40" height="6" rx="3" fill="#fff" opacity=".55"/><rect x="86" y="0" width="74" height="104" rx="8" fill="#7c3aed"/><rect x="94" y="80" width="40" height="6" rx="3" fill="#fff" opacity=".55"/><rect x="172" y="0" width="74" height="104" rx="8" fill="#ef4444"/><rect x="180" y="80" width="40" height="6" rx="3" fill="#fff" opacity=".55"/><rect x="258" y="0" width="74" height="104" rx="8" fill="#0ea5e9"/><rect x="266" y="80" width="40" height="6" rx="3" fill="#fff" opacity=".55"/><rect x="344" y="0" width="74" height="104" rx="8" fill="#10b981"/><rect x="352" y="80" width="40" height="6" rx="3" fill="#fff" opacity=".55"/><rect x="430" y="0" width="74" height="104" rx="8" fill="#f59e0b"/><rect x="438" y="80" width="40" height="6" rx="3" fill="#fff" opacity=".55"/><rect x="516" y="0" width="74" height="104" rx="8" fill="#7c3aed"/><rect x="524" y="80" width="40" height="6" rx="3" fill="#fff" opacity=".55"/><rect x="602" y="0" width="74" height="104" rx="8" fill="#ef4444"/><rect x="610" y="80" width="40" height="6" rx="3" fill="#fff" opacity=".55"/><rect x="688" y="0" width="74" height="104" rx="8" fill="#0ea5e9"/><rect x="696" y="80" width="40" height="6" rx="3" fill="#fff" opacity=".55"/><rect x="774" y="0" width="74" height="104" rx="8" fill="#10b981"/><rect x="782" y="80" width="40" height="6" rx="3" fill="#fff" opacity=".55"/></g></g>
  <rect x="300" y="26" width="276" height="132" fill="#000" opacity=".35"/></g>
  <g class="play"><circle cx="438" cy="92" r="28" fill="#f59e0b"/><path d="M429 78l24 14-24 14z" fill="#1a1206"/></g>
  <g fill="#f59e0b" opacity=".9"><rect x="32" y="40" width="120" height="10" rx="5"/><rect x="32" y="60" width="200" height="8" rx="4" opacity=".4"/><rect x="32" y="76" width="170" height="8" rx="4" opacity=".4"/></g>
  <g transform="translate(32 102)"><rect width="210" height="6" rx="3" fill="#fff" opacity=".15"/><rect width="210" height="6" rx="3" fill="#f59e0b"><animate attributeName="width" values="0;210" dur="6s" repeatCount="indefinite"/></rect></g>
  <rect x=".5" y=".5" width="599" height="219" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</g>
<text x="32" y="186" font-size="34" font-weight="700" fill="#fff" letter-spacing="-.5">Veltoret</text>
<text x="33" y="206" font-size="13" fill="#ffffff" fill-opacity=".65">Your movies and shows, as a private cinema</text>
</svg>